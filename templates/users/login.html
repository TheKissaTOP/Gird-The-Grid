{% extends "users/base.html" %}{% block title %}Вхід — Grid the Grid{% endblock %}{% block user_content %}
<div class="auth-wrap"><div class="card"><h1>З поверненням</h1><p class="sub" style="margin-bottom:22px">Увійдіть, щоб керувати електричною мережею.</p>{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}<p><label for="username">Логін</label><input id="username" name="username" autocomplete="username" required autofocus></p><p><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required></p><button type="submit" style="width:100%">Увійти до системи →</button></form><p class="muted" style="margin:18px 0 0;text-align:center">Немає акаунта? <a href="{% url 'register' %}">Створити обліковий запис</a></p></div></div>{% endblock %}

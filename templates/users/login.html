{% extends "users/base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<h1>Вхід</h1>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post">
  {% csrf_token %}
  <label>Логін</label>
  <input name="username">
  <label>Пароль</label>
  <input name="password" type="password">
  <button type="submit">Увійти</button>
</form>
<p>Немає акаунта? <a href="{% url 'register' %}">Зареєструватися</a></p>
{% endblock %}

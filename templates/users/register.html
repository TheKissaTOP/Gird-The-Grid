{% extends "users/base.html" %}
{% block title %}Реєстрація{% endblock %}
{% block content %}
<h1>Реєстрація</h1>
<p>Нові користувачі отримують роль «Аналітик». Іншу роль призначає керівник.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Зареєструватися</button>
</form>
<p>Вже є акаунт? <a href="{% url 'login' %}">Увійти</a></p>
{% endblock %}
